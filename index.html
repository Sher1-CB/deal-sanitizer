<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deal Sanitizer & Auto-Masker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    .full-width { grid-column: span 2; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #94a3b8; }
    input, textarea, select, button { width: 100%; box-sizing: border-box; margin-bottom: 1rem; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    canvas { max-width: 100%; height: auto; border-radius: 6px; background: #000; display: block; }
    .preview-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="container">
  <div class="card full-width">
    <h2>Automated Deal Asset Sanitizer</h2>
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
  </div>

  <!-- Left: Inputs -->
  <div class="card">
    <h3>Input Details</h3>
    <label>Upload Product Image</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>Original Product Title & Details</label>
    <textarea id="rawCopy" rows="4" placeholder="e.g., Clorox Wipes 3-Pack Lemon Scent, Original Retail $14.99"></textarea>

    <label>Masking Mode</label>
    <select id="maskMode">
      <option value="ribbon">Deal Ribbon / Badge Stamp</option>
      <option value="pixelate">Mosaic Pixelation</option>
      <option value="blur">Gaussian Blur</option>
    </select>

    <button id="processBtn">Process & Sanitize</button>
  </div>

  <!-- Right: Masked Graphic Preview -->
  <div class="card preview-box">
    <h3>Masked Output</h3>
    <canvas id="outputCanvas"></canvas>
    <button id="downloadBtn" style="display:none; margin-top: 1rem; background: #10b981;">Download Image</button>
  </div>

  <!-- Bottom: Compliant Text Output -->
  <div class="card full-width">
    <h3>Sanitized Compliant Copy</h3>
    <textarea id="cleanCopy" rows="3" readonly placeholder="Sanitized copy will appear here..."></textarea>
    <button id="copyTextBtn" style="display:none;">Copy Text</button>
  </div>
</div>

<script>
  let base64Image = "";
  let imageMimeType = "image/jpeg";
  const canvas = document.getElementById("outputCanvas");
  const ctx = canvas.getContext("2d");

  // Load and preview image
  document.getElementById("imageInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    imageMimeType = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = function(evt) {
      base64Image = evt.target.result.split(",")[1];
      const img = new Image();
      img.onload = () => {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("processBtn").addEventListener("click", async () => {
    const key = document.getElementById("apiKey").value.trim();
    const rawCopy = document.getElementById("rawCopy").value.trim();
    const mode = document.getElementById("maskMode").value;

    if (!key) {
      alert("Please enter your Gemini API Key.");
      return;
    }
    if (!base64Image) {
      alert("Please select an image first.");
      return;
    }

    const btn = document.getElementById("processBtn");
    btn.disabled = true;
    btn.innerText = "Analyzing & Masking...";

    try {
      // 1. Call Gemini to detect coordinates
      const detectPrompt = "Detect all brand logos, trademarks, and manufacturer brand text in this image. Return a JSON object with a single key 'boxes' containing an array of normalized coordinates [ymin, xmin, ymax, xmax] (0 to 1000).";

      const detectResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: detectPrompt },
              { inline_data: { mime_type: imageMimeType, data: base64Image } }
            ]
          }]
        })
      });

      const detectData = await detectResponse.json();

      // Catch Google API errors directly
      if (!detectResponse.ok || detectData.error) {
        throw new Error(detectData.error?.message || `API Error: HTTP ${detectResponse.status}`);
      }

      if (!detectData.candidates || detectData.candidates.length === 0) {
        throw new Error("No response candidates returned by Google (possible safety block).");
      }

      // 2. Parse coordinates safely
      let rawText = detectData.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
      
      let parsed = JSON.parse(rawText);
      let boxes = Array.isArray(parsed) ? parsed : (parsed.boxes || []);

      if (boxes.length === 0) {
        alert("No prominent brand logos detected in this image.");
      }

      // 3. Apply selected mask effect
      boxes.forEach(box => {
        const [ymin, xmin, ymax, xmax] = box;
        const x = (xmin / 1000) * canvas.width;
        const y = (ymin / 1000) * canvas.height;
        const w = ((xmax - xmin) / 1000) * canvas.width;
        const h = ((ymax - ymin) / 1000) * canvas.height;

        if (mode === "pixelate") {
          applyPixelation(x, y, w, h);
        } else if (mode === "blur") {
          applyBlur(x, y, w, h);
        } else {
          applyRibbonBadge(x, y, w, h);
        }
      });

      // 4. Generate clean post copy
      if (rawCopy) {
        const copyPrompt = `Analyze this product description: "${rawCopy}". Rewrite it into a 2-sentence social deal post. STRICT RULES: 1) Never mention the brand name, parent company, or trademarked characters. 2) Replace any health or medical claim words ('disinfect', 'disinfecting', 'sanitizer', 'antibacterial') with generic equivalents ('cleaning', 'surface wipes', 'refresher'). 3) Do not include raw dollar amounts.`;

        const copyResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: copyPrompt }] }] })
        });

        const copyData = await copyResponse.json();
        if (copyData.candidates && copyData.candidates[0]?.content?.parts[0]?.text) {
          document.getElementById("cleanCopy").value = copyData.candidates[0].content.parts[0].text.trim();
          document.getElementById("copyTextBtn").style.display = "block";
        }
      }

      document.getElementById("downloadBtn").style.display = "block";
    } catch (err) {
      console.error(err);
      alert("Error processing: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Process & Sanitize";
    }
  });

  // Canvas Masking Functions
  function applyRibbonBadge(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.max(12, Math.floor(h * 0.4))}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("SPECIAL DEAL", x + w / 2, y + h / 2);
    ctx.restore();
  }

  function applyPixelation(x, y, w, h) {
    const scale = 0.08;
    const off = document.createElement("canvas");
    off.width = Math.max(1, w * scale);
    off.height = Math.max(1, h * scale);
    const offCtx = off.getContext("2d");

    offCtx.drawImage(canvas, x, y, w, h, 0, 0, off.width, off.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, off.width, off.height, x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  }

  function applyBlur(x, y, w, h) {
    ctx.save();
    ctx.filter = "blur(18px)";
    ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
    ctx.restore();
  }

  // Export & Copy Helpers
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "sanitized-deal.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  document.getElementById("copyTextBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("cleanCopy").value);
    alert("Caption copied to clipboard!");
  });
</script>
</body>
</html>
