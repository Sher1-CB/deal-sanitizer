<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deal Sanitizer & Auto-Masker v1.0.05</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      padding: 2.5rem 2rem 2rem; 
      position: relative;
    }
    
    .app-version {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.05em;
      user-select: none;
    }

    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    .full-width { grid-column: span 2; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #94a3b8; }
    input, textarea, select, button { width: 100%; box-sizing: border-box; margin-bottom: 1rem; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    button.success { background: #10b981; }
    button.success:hover { background: #059669; }

    .btn-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .btn-row button { margin-bottom: 0; }

    canvas { max-width: 100%; height: auto; border-radius: 6px; background: #000; display: block; cursor: crosshair; }
    .preview-box { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
    .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 0.3rem; margin-bottom: 1rem; }

    /* Poster Suggestions Box */
    .suggestions-container {
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }
    .suggestions-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .suggestions-list {
      margin: 0;
      padding-left: 1.2rem;
      color: #cbd5e1;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .suggestions-list li { margin-bottom: 0.35rem; }
  </style>
</head>
<body>

<div class="app-version">v1.0.05</div>

<div class="container">
  <div class="card full-width">
    <h2>Automated Deal Asset Sanitizer</h2>
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label>Gemini Model</label>
    <select id="modelSelect">
      <option value="gemini-flash-latest" selected>gemini-flash-latest (Recommended)</option>
      <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
      <option value="gemini-3.5-flash">gemini-3.5-flash</option>
      <option value="gemini-3.8-flash">gemini-3.8-flash</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    </select>
  </div>

  <!-- Left: Inputs & Configuration -->
  <div class="card">
    <h3>Input Controls</h3>
    
    <label>Product Image</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>Sanitization Scope</label>
    <select id="sanitizationScope">
      <option value="aggressive" selected>Full Deep Scrub (Logos + Claims + "Sanitizer" + Banners)</option>
      <option value="logos_only">Brand Logos & Trademarks Only</option>
    </select>

    <label>Masking Visual Style</label>
    <select id="maskMode">
      <option value="blur" selected>Zero-Leak Frosted Blur (OCR Proof)</option>
      <option value="ribbon">Decorative Deal Ribbon Stamp</option>
      <option value="pixelate">Mosaic Pixelation</option>
      <option value="solid">Clean Dark Tape</option>
    </select>

    <label>Ribbon Badge Text (if using Deal Ribbon)</label>
    <select id="badgeTextSelect">
      <option value="BUNDLE DEAL" selected>BUNDLE DEAL</option>
      <option value="LIMITED DEAL">LIMITED DEAL</option>
      <option value="SPECIAL OFFER">SPECIAL OFFER</option>
      <option value="SUPER VALUE">SUPER VALUE</option>
      <option value="EXCLUSIVE">EXCLUSIVE</option>
    </select>

    <label>Product Title / Deal Notes</label>
    <textarea id="rawCopy" rows="3" placeholder="e.g., Lysol Air Sanitizer Spray 3-Pack, Simple Fresh Scent"></textarea>

    <div class="btn-row">
      <button id="processBtn">Process Image with AI</button>
      <button id="resetBtn" class="danger">Upload New / Reset</button>
    </div>
  </div>

  <!-- Right: Interactive Canvas Output -->
  <div class="card preview-box">
    <h3>Masked Output Preview</h3>
    <div class="hint">💡 <b>Tip:</b> Click and drag directly on the image below to manually mask anything the AI missed.</div>
    <canvas id="outputCanvas"></canvas>
    
    <div class="btn-row" style="width: 100%; margin-top: 1rem;">
      <button id="reapplyBtn" class="secondary" title="Switch mask mode without re-calling API">Re-apply Style</button>
      <button id="undoBtn" class="secondary" title="Remove the last manual box">Undo Last Mask</button>
      <button id="downloadBtn" class="success" style="display:none;">Download</button>
    </div>
  </div>

  <!-- Bottom: Sanitized Copy & Suggestions for the Poster -->
  <div class="card full-width">
    <h3>Sanitized Compliant Copy</h3>
    <textarea id="cleanCopy" rows="3" readonly placeholder="Compliant copy will appear here..."></textarea>
    <button id="copyTextBtn" style="display:none; width: auto; padding: 0.5rem 1rem;">Copy Caption to Clipboard</button>

    <!-- NEW: Poster Suggestions Component -->
    <div id="posterSuggestions" class="suggestions-container" style="display:none;">
      <div class="suggestions-title">
        <span>💡</span> Suggestions & Compliance Tips for the Poster
      </div>
      <ul id="suggestionsList" class="suggestions-list">
        <!-- Rendered dynamically -->
      </ul>
    </div>
  </div>
</div>

<script>
  let base64Image = "";
  let imageMimeType = "image/jpeg";
  let loadedImage = null;

  let aiBoxes = [];
  let manualBoxes = [];

  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;

  const canvas = document.getElementById("outputCanvas");
  const ctx = canvas.getContext("2d");

  // LocalStorage Key Sync
  const keyInput = document.getElementById("apiKey");
  const savedKey = localStorage.getItem("deal_gemini_key");
  if (savedKey) keyInput.value = savedKey;

  keyInput.addEventListener("change", () => {
    localStorage.setItem("deal_gemini_key", keyInput.value.trim());
  });

  // Handle Image Upload
  document.getElementById("imageInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    imageMimeType = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = function(evt) {
      base64Image = evt.target.result.split(",")[1];
      loadedImage = new Image();
      loadedImage.onload = () => {
        canvas.width = loadedImage.naturalWidth;
        canvas.height = loadedImage.naturalHeight;
        aiBoxes = [];
        manualBoxes = [];
        renderAllMasks();
      };
      loadedImage.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Reset / Upload New
  document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("imageInput").value = "";
    document.getElementById("rawCopy").value = "";
    document.getElementById("cleanCopy").value = "";
    document.getElementById("posterSuggestions").style.display = "none";
    loadedImage = null;
    base64Image = "";
    aiBoxes = [];
    manualBoxes = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById("downloadBtn").style.display = "none";
    document.getElementById("copyTextBtn").style.display = "none";
  });

  // Re-apply style without calling the API again
  document.getElementById("reapplyBtn").addEventListener("click", () => {
    if (!loadedImage) return;
    renderAllMasks();
  });

  // Undo last mask
  document.getElementById("undoBtn").addEventListener("click", () => {
    if (manualBoxes.length > 0) {
      manualBoxes.pop();
      renderAllMasks();
    } else if (aiBoxes.length > 0) {
      aiBoxes.pop();
      renderAllMasks();
    }
  });

  // Process with AI
  document.getElementById("processBtn").addEventListener("click", async () => {
    const key = keyInput.value.trim();
    const rawCopy = document.getElementById("rawCopy").value.trim();
    const scope = document.getElementById("sanitizationScope").value;
    const selectedModel = document.getElementById("modelSelect").value;

    if (!key) return alert("Please enter your Gemini API Key.");
    if (!base64Image) return alert("Please select an image first.");

    const btn = document.getElementById("processBtn");
    btn.disabled = true;
    btn.innerText = "Scanning Packaging & Claims...";

    try {
      // Prompt targeting logos, text, claims, and banners
      let detectPrompt = "";
      if (scope === "aggressive") {
        detectPrompt = "Locate all brand logos (e.g., Lysol, Clorox), trademarks, AND every piece of regulated medical/sanitizing text on the packaging including 'AIR SANITIZER', 'SANITIZER', 'DISINFECTANT', 'ANTIBACTERIAL', 'KILLING 99.9%', 'VIRUSES', 'BACTERIA', 'SCIENTIFICALLY PROVEN', and claim banners across packaging bands. Return a JSON object with key 'boxes': [[ymin, xmin, ymax, xmax]] (normalized 0 to 1000 integers).";
      } else {
        detectPrompt = "Detect all brand logos and trademarks in this image. Return a JSON object with key 'boxes': [[ymin, xmin, ymax, xmax]] (normalized 0 to 1000 integers).";
      }

      const detectData = await callGeminiWithFallback(key, {
        contents: [{
          parts: [
            { text: detectPrompt },
            { inline_data: { mime_type: imageMimeType, data: base64Image } }
          ]
        }]
      }, selectedModel);

      let rawText = detectData.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
      let parsed = JSON.parse(rawText);
      aiBoxes = Array.isArray(parsed) ? parsed : (parsed.boxes || []);

      renderAllMasks();

      // Copy & Poster Suggestions Generation
      const copyPrompt = `
      Product: "${rawCopy || 'Cleaning/Aerosol Multipack'}".
      Tasks:
      1. Write a 2-sentence social deal post. RULES: Never mention brand names, parent company, or medical claim words ('disinfect', 'sanitizer', 'antibacterial'). Use generic terms like 'cleaning spray', 'room refresher'. Do not mention dollar amounts.
      2. Provide 3 concise bullet suggestions for the affiliate deal poster explaining how to safely post this deal graphic on social channels (mentioning stamping ribbons over claim strips, keeping pack sizes visible, and avoiding restricted keywords in comments).
      
      Return a clean JSON object:
      {
        "caption": "your 2-sentence deal post",
        "suggestions": [
          "Suggestion 1",
          "Suggestion 2",
          "Suggestion 3"
        ]
      }
      `;

      const copyData = await callGeminiWithFallback(key, {
        contents: [{ parts: [{ text: copyPrompt }] }]
      }, selectedModel);

      let copyRaw = copyData.candidates[0]?.content?.parts[0]?.text || "{}";
      copyRaw = copyRaw.replace(/```json/g, "").replace(/```/g, "").trim();
      
      try {
        const copyJson = JSON.parse(copyRaw);
        document.getElementById("cleanCopy").value = copyJson.caption || copyRaw;
        
        // Render Suggestions
        const suggestionsBox = document.getElementById("posterSuggestions");
        const list = document.getElementById("suggestionsList");
        list.innerHTML = "";

        // Default smart suggestion about ribbons vs blurs
        const defaultTip = document.createElement("li");
        defaultTip.innerHTML = `<b>Ribbon vs Blur:</b> Consider stamping a solid <b>"BUNDLE DEAL"</b> or <b>"LIMITED DEAL"</b> ribbon directly over the middle red claim strip. This fully blocks OCR text crawlers while increasing viewer engagement.`;
        list.appendChild(defaultTip);

        if (Array.isArray(copyJson.suggestions)) {
          copyJson.suggestions.forEach(tip => {
            const li = document.createElement("li");
            li.textContent = tip;
            list.appendChild(li);
          });
        }
        suggestionsBox.style.display = "block";
      } catch (e) {
        document.getElementById("cleanCopy").value = copyRaw;
      }

      document.getElementById("copyTextBtn").style.display = "inline-block";
      document.getElementById("downloadBtn").style.display = "inline-block";
    } catch (err) {
      console.error(err);
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Process Image with AI";
    }
  });

  // Render Pipeline
  function renderAllMasks() {
    if (!loadedImage) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(loadedImage, 0, 0);

    const mode = document.getElementById("maskMode").value;
    const badgeText = document.getElementById("badgeTextSelect").value;
    const allBoxes = [...aiBoxes, ...manualBoxes];

    allBoxes.forEach(box => {
      const [ymin, xmin, ymax, xmax] = box;
      const x = (xmin / 1000) * canvas.width;
      const y = (ymin / 1000) * canvas.height;
      const w = ((xmax - xmin) / 1000) * canvas.width;
      const h = ((ymax - ymin) / 1000) * canvas.height;

      if (mode === "pixelate") {
        applyPixelation(x, y, w, h);
      } else if (mode === "ribbon") {
        applyCleanRibbon(x, y, w, h, badgeText);
      } else if (mode === "solid") {
        applySolidTape(x, y, w, h);
      } else {
        applyZeroLeakBlur(x, y, w, h);
      }
    });

    document.getElementById("downloadBtn").style.display = "inline-block";
  }

  // Zero-Leak Frosted Blur (Pixelates text first, then blurs to completely kill OCR text stems)
  function applyZeroLeakBlur(x, y, w, h) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - 3, y - 3, w + 6, h + 6);
    ctx.clip();

    // 1. Heavy downsample to destroy character glyphs
    const scale = 0.035;
    const off = document.createElement("canvas");
    off.width = Math.max(1, Math.floor(w * scale));
    off.height = Math.max(1, Math.floor(h * scale));
    const offCtx = off.getContext("2d");

    offCtx.drawImage(canvas, x, y, w, h, 0, 0, off.width, off.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, off.width, off.height, x, y, w, h);

    // 2. Multi-pass Gaussian blur over the mosaic for a clean frosted aesthetic
    ctx.filter = "blur(20px)";
    ctx.drawImage(canvas, x - 10, y - 10, w + 20, h + 20, x - 10, y - 10, w + 20, h + 20);
    ctx.drawImage(canvas, x - 10, y - 10, w + 20, h + 20, x - 10, y - 10, w + 20, h + 20);

    ctx.restore();
  }

  function applyPixelation(x, y, w, h) {
    const scale = 0.04;
    const off = document.createElement("canvas");
    off.width = Math.max(1, Math.floor(w * scale));
    off.height = Math.max(1, Math.floor(h * scale));
    const offCtx = off.getContext("2d");

    offCtx.drawImage(canvas, x, y, w, h, 0, 0, off.width, off.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, off.width, off.height, x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  }

  function applyCleanRibbon(x, y, w, h, text) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    // Clean gradient ribbon
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, "#ef4444");
    grad.addColorStop(1, "#b91c1c");
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    let fontSize = Math.min(h * 0.4, w * 0.15);
    fontSize = Math.max(11, Math.floor(fontSize));

    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + w / 2, y + h / 2, w - 6);
    ctx.restore();
  }

  function applySolidTape(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.restore();
  }

  // Interactive Drag-to-Mask
  function getCanvasCoords(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener("mousedown", (e) => {
    if (!loadedImage) return;
    isDragging = true;
    const pt = getCanvasCoords(e);
    dragStartX = pt.x;
    dragStartY = pt.y;
  });

  canvas.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const pt = getCanvasCoords(e);
    renderAllMasks();

    ctx.save();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(dragStartX, dragStartY, pt.x - dragStartX, pt.y - dragStartY);
    ctx.restore();
  });

  canvas.addEventListener("mouseup", (e) => {
    if (!isDragging) return;
    isDragging = false;
    const pt = getCanvasCoords(e);

    const x1 = Math.min(dragStartX, pt.x);
    const y1 = Math.min(dragStartY, pt.y);
    const x2 = Math.max(dragStartX, pt.x);
    const y2 = Math.max(dragStartY, pt.y);

    if (x2 - x1 > 8 && y2 - y1 > 8) {
      manualBoxes.push([
        Math.round((y1 / canvas.height) * 1000),
        Math.round((x1 / canvas.width) * 1000),
        Math.round((y2 / canvas.height) * 1000),
        Math.round((x2 / canvas.width) * 1000)
      ]);
    }
    renderAllMasks();
  });

  // Fallback API Call
  async function callGeminiWithFallback(key, body, initialModel) {
    const candidateModels = [
      initialModel,
      "gemini-flash-latest",
      "gemini-3.5-flash-lite",
      "gemini-3.5-flash",
      "gemini-2.5-flash"
    ].filter((v, i, a) => v && a.indexOf(v) === i);

    let lastError = null;
    for (const model of candidateModels) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          if (data.error?.code === 404 || data.error?.message?.includes("not found")) {
            lastError = new Error(data.error.message);
            continue;
          }
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }
        return data;
      } catch (err) {
        if (err.message && err.message.includes("not found")) {
          lastError = err;
          continue;
        }
        throw err;
      }
    }
    throw lastError || new Error("All active Gemini models failed.");
  }

  // Export & Copy
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "sanitized-deal.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  document.getElementById("copyTextBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("cleanCopy").value);
    alert("Caption copied to clipboard!");
  });
</script>
</body>
</html>
