<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deal Sanitizer & Auto-Masker</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      padding: 2.5rem 2rem 2rem; 
      position: relative;
    }
    
    /* Top-Right Version Indicator */
    .app-version {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.05em;
      user-select: none;
    }

    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    .full-width { grid-column: span 2; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #94a3b8; }
    input, textarea, select, button { width: 100%; box-sizing: border-box; margin-bottom: 1rem; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { background: #3b82f6; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    canvas { max-width: 100%; height: auto; border-radius: 6px; background: #000; display: block; }
    .preview-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .status-msg { font-size: 0.75rem; color: #38bdf8; margin-top: -0.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

<!-- Top Right Version Badge -->
<div class="app-version">v1.0.03</div>

<div class="container">
  <div class="card full-width">
    <h2>Automated Deal Asset Sanitizer</h2>
    
    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
    <div id="keyStatus" class="status-msg" style="display:none;"></div>

    <label>Gemini Model</label>
    <select id="modelSelect">
      <!-- Active models from your console -->
      <option value="gemini-flash-latest" selected>gemini-flash-latest (Recommended)</option>
      <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Fastest)</option>
      <option value="gemini-3.5-flash">gemini-3.5-flash</option>
      <option value="gemini-3.8-flash">gemini-3.8-flash</option>
      <option value="gemini-3.7-flash">gemini-3.7-flash</option>
      <option value="gemini-3.6-flash">gemini-3.6-flash</option>
      <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
    </select>
  </div>

  <!-- Left: Inputs -->
  <div class="card">
    <h3>Input Details</h3>
    <label>Upload Product Image</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>Original Product Title & Details</label>
    <textarea id="rawCopy" rows="4" placeholder="e.g., Clorox Wipes 3-Pack Lemon Scent, Original Retail $14.99"></textarea>

    <label>Masking Mode</label>
    <select id="maskMode">
      <option value="ribbon">Deal Ribbon / Badge Stamp</option>
      <option value="pixelate">Mosaic Pixelation</option>
      <option value="blur">Gaussian Blur</option>
    </select>

    <button id="processBtn">Process & Sanitize</button>
  </div>

  <!-- Right: Masked Graphic Preview -->
  <div class="card preview-box">
    <h3>Masked Output</h3>
    <canvas id="outputCanvas"></canvas>
    <button id="downloadBtn" style="display:none; margin-top: 1rem; background: #10b981;">Download Image</button>
  </div>

  <!-- Bottom: Compliant Text Output -->
  <div class="card full-width">
    <h3>Sanitized Compliant Copy</h3>
    <textarea id="cleanCopy" rows="3" readonly placeholder="Sanitized copy will appear here..."></textarea>
    <button id="copyTextBtn" style="display:none;">Copy Text</button>
  </div>
</div>

<script>
  let base64Image = "";
  let imageMimeType = "image/jpeg";
  const canvas = document.getElementById("outputCanvas");
  const ctx = canvas.getContext("2d");

  // Save/Load API key from LocalStorage for convenience
  const keyInput = document.getElementById("apiKey");
  const savedKey = localStorage.getItem("deal_gemini_key");
  if (savedKey) {
    keyInput.value = savedKey;
  }

  keyInput.addEventListener("change", () => {
    localStorage.setItem("deal_gemini_key", keyInput.value.trim());
    fetchAvailableModels(keyInput.value.trim());
  });

  // Query Google ModelService to ensure the dropdown syncs with account access
  async function fetchAvailableModels(key) {
    if (!key) return;
    const statusDiv = document.getElementById("keyStatus");
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
      const data = await res.json();
      if (data.models && data.models.length > 0) {
        const select = document.getElementById("modelSelect");
        const supported = data.models
          .filter(m => m.supportedGenerationMethods?.includes("generateContent") && m.name.includes("flash"))
          .map(m => m.name.replace("models/", ""));

        if (supported.length > 0) {
          select.innerHTML = "";
          supported.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            if (name === "gemini-flash-latest" || name === "gemini-3.5-flash-lite") opt.selected = true;
            select.appendChild(opt);
          });
          statusDiv.innerText = `Synced ${supported.length} active models from your account.`;
          statusDiv.style.display = "block";
        }
      }
    } catch (e) {
      // Keep static list if listModels fails
    }
  }

  // Load and preview image
  document.getElementById("imageInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    imageMimeType = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = function(evt) {
      base64Image = evt.target.result.split(",")[1];
      const img = new Image();
      img.onload = () => {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Call Gemini API with modern fallback chain
  async function callGemini(key, body, preferredModel) {
    const fallbackList = [
      preferredModel,
      "gemini-flash-latest",
      "gemini-3.5-flash-lite",
      "gemini-3.5-flash",
      "gemini-2.5-flash"
    ].filter((v, i, a) => v && a.indexOf(v) === i);

    let lastError = null;

    for (const model of fallbackList) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          if (data.error?.code === 404 || data.error?.message?.includes("not found")) {
            lastError = new Error(data.error.message);
            continue;
          }
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        return data;
      } catch (err) {
        if (err.message && err.message.includes("not found")) {
          lastError = err;
          continue;
        }
        throw err;
      }
    }

    throw lastError || new Error("All active Gemini models failed.");
  }

  document.getElementById("processBtn").addEventListener("click", async () => {
    const key = keyInput.value.trim();
    const rawCopy = document.getElementById("rawCopy").value.trim();
    const mode = document.getElementById("maskMode").value;
    const selectedModel = document.getElementById("modelSelect").value;

    if (!key) {
      alert("Please enter your Gemini API Key.");
      return;
    }
    if (!base64Image) {
      alert("Please select an image first.");
      return;
    }

    const btn = document.getElementById("processBtn");
    btn.disabled = true;
    btn.innerText = "Analyzing & Masking...";

    try {
      // 1. Detect coordinates
      const detectPrompt = "Detect all brand logos, trademarks, and manufacturer brand text in this image. Return a JSON object with key 'boxes' containing an array of normalized coordinates [ymin, xmin, ymax, xmax] (0 to 1000).";

      const detectData = await callGemini(key, {
        contents: [{
          parts: [
            { text: detectPrompt },
            { inline_data: { mime_type: imageMimeType, data: base64Image } }
          ]
        }]
      }, selectedModel);

      if (!detectData.candidates || detectData.candidates.length === 0) {
        throw new Error("No response candidates returned by Google (safety filter trigger).");
      }

      // 2. Parse coordinates
      let rawText = detectData.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
      
      let parsed = JSON.parse(rawText);
      let boxes = Array.isArray(parsed) ? parsed : (parsed.boxes || []);

      if (boxes.length === 0) {
        alert("No prominent brand logos detected in this image.");
      }

      // 3. Mask canvas
      boxes.forEach(box => {
        const [ymin, xmin, ymax, xmax] = box;
        const x = (xmin / 1000) * canvas.width;
        const y = (ymin / 1000) * canvas.height;
        const w = ((xmax - xmin) / 1000) * canvas.width;
        const h = ((ymax - ymin) / 1000) * canvas.height;

        if (mode === "pixelate") {
          applyPixelation(x, y, w, h);
        } else if (mode === "blur") {
          applyBlur(x, y, w, h);
        } else {
          applyRibbonBadge(x, y, w, h);
        }
      });

      // 4. Generate compliant text
      if (rawCopy) {
        const copyPrompt = `Analyze this product description: "${rawCopy}". Rewrite it into a 2-sentence social deal post. STRICT RULES: 1) Never mention the brand name, parent company, or trademarked characters. 2) Replace any health or medical claim words ('disinfect', 'disinfecting', 'sanitizer', 'antibacterial') with generic equivalents ('cleaning', 'surface wipes', 'refresher'). 3) Do not include raw dollar amounts.`;

        const copyData = await callGemini(key, {
          contents: [{ parts: [{ text: copyPrompt }] }]
        }, selectedModel);

        if (copyData.candidates && copyData.candidates[0]?.content?.parts[0]?.text) {
          document.getElementById("cleanCopy").value = copyData.candidates[0].content.parts[0].text.trim();
          document.getElementById("copyTextBtn").style.display = "block";
        }
      }

      document.getElementById("downloadBtn").style.display = "block";
    } catch (err) {
      console.error(err);
      alert("Error processing: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Process & Sanitize";
    }
  });

  // Canvas Masking Effects
  function applyRibbonBadge(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.max(12, Math.floor(h * 0.4))}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("SPECIAL DEAL", x + w / 2, y + h / 2);
    ctx.restore();
  }

  function applyPixelation(x, y, w, h) {
    const scale = 0.08;
    const off = document.createElement("canvas");
    off.width = Math.max(1, w * scale);
    off.height = Math.max(1, h * scale);
    const offCtx = off.getContext("2d");

    offCtx.drawImage(canvas, x, y, w, h, 0, 0, off.width, off.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, 0, 0, off.width, off.height, x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  }

  function applyBlur(x, y, w, h) {
    ctx.save();
    ctx.filter = "blur(18px)";
    ctx.drawImage(canvas, x, y, w, h, x, y, w, h);
    ctx.restore();
  }

  // Helpers
  document.getElementById("downloadBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "sanitized-deal.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  document.getElementById("copyTextBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("cleanCopy").value);
    alert("Caption copied to clipboard!");
  });
</script>
</body>
</html>
